<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">

<title>Kerala Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5/dist/hls.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #0b0f19;
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  .app-container {
    display: flex;
    width: 100vw;
    height: 100vh;
    background-color: #0b0f19;
  }
  .sidebar {
    width: 38%;
    height: 100%;
    background-color: #111827;
    border-right: 2px solid #1f2937;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 12px 14px;
    background-color: #0f172a;
    border-bottom: 2px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
  }
  .brand-logo {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: linear-gradient(135deg, #16a34a, #dc2626);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 15px;
    color: #fff;
    margin-right: 10px;
    border: 2px solid #facc15;
  }
  .brand-title {
    font-size: 16px;
    font-weight: bold;
    color: #f8fafc;
  }
  .brand-sub {
    font-size: 11px;
    color: #38bdf8;
    margin-top: 2px;
  }
  .top-btns {
    display: flex;
  }
  .sync-btn {
    background-color: #0284c7;
    color: #fff;
    border: 2px solid transparent;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    margin-left: 6px;
  }
  .sync-btn:focus, .sync-btn.focused {
    border-color: #facc15;
    background-color: #0369a1;
    outline: none;
  }
  .cat-bar {
    display: flex;
    padding: 10px 12px;
    background-color: #161f30;
    overflow-x: auto;
    border-bottom: 1px solid #1f2937;
  }
  .cat-btn {
    background-color: #1e293b;
    color: #cbd5e1;
    border: 2px solid transparent;
    padding: 6px 14px;
    margin-right: 8px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-btn.active {
    background-color: #16a34a;
    color: #ffffff;
  }
  .cat-btn:focus, .cat-btn.focused {
    border-color: #facc15;
    outline: none;
  }
  .channel-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
  }
  .ch-card {
    display: flex;
    align-items: center;
    background-color: #1e293b;
    border: 3px solid transparent;
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .ch-card.playing {
    background-color: #172554;
    border-color: #3b82f6;
  }
  .ch-card:focus, .ch-card.focused {
    border-color: #facc15 !important;
    background-color: #334155;
    outline: none;
  }
  .ch-num {
    width: 28px;
    font-size: 14px;
    font-weight: bold;
    color: #94a3b8;
  }
  .ch-logo {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 14px;
    color: #ffffff;
    margin-right: 12px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .ch-info {
    flex: 1;
    overflow: hidden;
  }
  .ch-name {
    font-size: 15px;
    font-weight: bold;
    color: #f8fafc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ch-cat {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 2px;
  }
  .live-dot {
    background-color: #dc2626;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 4px;
  }
  .player-area {
    width: 62%;
    height: 100%;
    background-color: #000000;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .video-wrapper {
    width: 100%;
    height: 78%;
    background-color: #000000;
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    background-color: #000000;
    object-fit: contain;
    display: block;
  }
  .yt-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background-color: #000;
  }
  .status-box {
    position: absolute;
    top: 15px;
    left: 15px;
    background-color: rgba(15, 23, 42, 0.85);
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: #38bdf8;
    z-index: 10;
  }
  .num-pad-osd {
    position: absolute;
    top: 15px;
    right: 20px;
    background-color: #facc15;
    color: #000;
    font-size: 26px;
    font-weight: bold;
    padding: 6px 16px;
    border-radius: 8px;
    display: none;
    z-index: 20;
  }
  .player-bar {
    width: 100%;
    height: 22%;
    background-color: #0f172a;
    border-top: 2px solid #1e293b;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .now-playing-title {
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
  }
  .now-playing-sub {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .ctrl-buttons {
    display: flex;
  }
  .ctrl-btn {
    background-color: #1e293b;
    color: #ffffff;
    border: 2px solid #334155;
    padding: 9px 14px;
    margin-left: 8px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
  }
  .ctrl-btn:focus, .ctrl-btn.focused {
    border-color: #facc15;
    background-color: #2563eb;
    outline: none;
  }
  body.fullscreen-tv .sidebar { display: none; }
  body.fullscreen-tv .player-area { width: 100vw; height: 100vh; }
  body.fullscreen-tv .video-wrapper { width: 100vw; height: 100vh; }
  body.fullscreen-tv .player-bar { display: none; }
</style>

      <video id="tvVideo" autoplay playsinline webkit-playsinline controls></video>
      <iframe id="ytFrame" class="yt-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="player-bar">
      <div>
        <div class="now-playing-title" id="npTitle">Kerala Live TV</div>
        <div class="now-playing-sub" id="npSub">Remote: Up/Down Arrows & OK Button</div>
      </div>
      <div class="ctrl-buttons">
        <button class="ctrl-btn focusable" onclick="tryBackupStream()">Next Server</button>
        <button class="ctrl-btn focusable" onclick="openYouTubeBackup()">YouTube Mode</button>
        <button class="ctrl-btn focusable" onclick="toggleFullScreenMode()">Full Screen</button>
      </div>
    </div>
  </div>
</div>

var currentCat = "All";
var currentChannel = null;
var currentUrlIndex = 0;
var hlsInstance = null;
var numBuffer = "";
var numTimer = null;

function renderChannels() {
  var listEl = document.getElementById("channelList");
  listEl.innerHTML = "";
  for (var i = 0; i < channels.length; i++) {
    var ch = channels[i];
    if (currentCat !== "All" && ch.cat !== currentCat) continue;

    var card = document.createElement("div");
    card.className = "ch-card focusable" + (currentChannel && currentChannel.id === ch.id ? " playing" : "");
    card.tabIndex = 0;
    card.onclick = (function(channelObj) {
      return function() {
        if (currentChannel && currentChannel.id === channelObj.id) {
          toggleFullScreenMode();
        } else {
          playChannel(channelObj, 0);
        }
      };
    })(ch);

    var statusTag = ch.urls && ch.urls.length > 0 ? "LIVE" : "AUTO";
    var dotColor = ch.urls && ch.urls.length > 0 ? "#16a34a" : "#dc2626";

    card.innerHTML =
      '<div class="ch-num">' + ch.id + '</div>' +
      '<div class="ch-logo" style="background-color:' + (ch.color || '#2563eb') + ';">' + ch.badge + '</div>' +
      '<div class="ch-info">' +
        '<div class="ch-name">' + ch.name + '</div>' +
        '<div class="ch-cat">' + ch.cat + '</div>' +
      '</div>' +
      '<div class="live-dot" style="background-color:' + dotColor + ';">' + statusTag + '</div>';

    listEl.appendChild(card);
  }
}

function filterCat(cat, btnEl) {
  currentCat = cat;
  var btns = document.querySelectorAll(".cat-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove("active");
  }
  if (btnEl) btnEl.classList.add("active");
  renderChannels();
}

function setStatus(msg) {
  var sb = document.getElementById("statusBox");
  sb.style.display = "block";
  sb.innerText = msg;
}

function playChannel(ch, urlIdx) {
  currentChannel = ch;
  currentUrlIndex = urlIdx || 0;
  document.getElementById("npTitle").innerText = ch.id + ". " + ch.name;
  document.getElementById("npSub").innerText = "Category: " + ch.cat + " | Server " + (currentUrlIndex + 1);
  renderChannels();

  var video = document.getElementById("tvVideo");
  var ytFrame = document.getElementById("ytFrame");

  ytFrame.style.display = "none";
  ytFrame.src = "";
  video.style.display = "block";

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  if (!ch.urls || ch.urls.length === 0 || currentUrlIndex >= ch.urls.length) {
    setStatus("Searching Live Stream for " + ch.name + "...");
    openYouTubeBackup();
    return;
  }

  var streamUrl = ch.urls[currentUrlIndex];
  setStatus("Loading HD: " + ch.name + "...");

  if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls({ enableWorker: true });
    hlsInstance.loadSource(streamUrl);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function(event, data) {
      if (data && data.levels && data.levels.length > 0) {
        hlsInstance.currentLevel = data.levels.length - 1;
      }
      setStatus("LIVE: " + ch.name);
      video.play().catch(function(){});
    });
    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        tryBackupStream();
      }
    });
  } else {
    video.src = streamUrl;
    video.play().catch(function(){});
  }
}

function tryBackupStream() {
  if (!currentChannel) return;
  if (currentChannel.urls && currentUrlIndex + 1 < currentChannel.urls.length) {
    playChannel(currentChannel, currentUrlIndex + 1);
  } else {
    openYouTubeBackup();
  }
}

function openYouTubeBackup() {
  if (!currentChannel) return;
  var video = document.getElementById("tvVideo");
  var ytFrame = document.getElementById("ytFrame");
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  video.pause();
  video.style.display = "none";
  ytFrame.style.display = "block";

  if (currentChannel.ytId) {
    setStatus("YouTube Live: " + currentChannel.name);
    ytFrame.src = "https://www.youtube.com/embed/" + currentChannel.ytId + "&autoplay=1";
  } else {
    setStatus("Direct M3U offline for " + currentChannel.name + ". Click '+ M3U' to add custom playlist.");
  }
}

function toggleFullScreenMode() {
  if (document.body.classList.contains("fullscreen-tv")) {
    document.body.classList.remove("fullscreen-tv");
  } else {
    document.body.classList.add("fullscreen-tv");
  }
}

function addCustomM3U() {
  var url = prompt("Enter Custom Malayalam M3U Playlist URL:", "https://iptv-org.github.io/iptv/languages/mal.m3u");
  if (url && url.indexOf("http") === 0) {
    fetchM3UUrl(url, true);
  }
}

function syncAllServers() {
  setStatus("Syncing Malayalam Entertainment & News Servers...");
  for (var i = 0; i < m3uSources.length; i++) {
    fetchM3UUrl(m3uSources[i], i === 0);
  }
}

function fetchM3UUrl(url, showMsg) {
  var xhr = new XMLHttpRequest();
  xhr.open("GET", url, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4 && xhr.status === 200) {
      parseM3U(xhr.responseText, showMsg);
    }
  };
  xhr.send();
}

function parseM3U(data, showMsg) {
  var lines = data.split("\n");
  var currentName = "";
  var currentLang = "";

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.indexOf("#EXTINF:") === 0) {
      var parts = line.split(",");
      currentName = parts[parts.length - 1].trim();
      currentLang = line.toLowerCase();
    } else if (line.indexOf("http") === 0 && currentName !== "") {
      var mName = currentName.toLowerCase();
      for (var j = 0; j < channels.length; j++) {
        var key = (channels[j].matchKey || channels[j].name).toLowerCase();
        var exKey = channels[j].excludeKey || "";
        if (mName.indexOf(key) !== -1 && (exKey === "" || mName.indexOf(exKey) === -1)) {
          if (channels[j].urls.indexOf(line) === -1) {
            channels[j].urls.unshift(line);
          }
          break;
        }
      }
      currentName = "";
    }
  }
  renderChannels();
  if (showMsg) {
    setStatus("All Malayalam Channels Synced! Ready to play.");
  }
}

document.addEventListener("keydown", function(e) {
  var key = e.keyCode || e.which;
  if (key >= 48 && key <= 57) {
    var digit = String(key - 48);
    numBuffer += digit;
    var osd = document.getElementById("numOsd");
    osd.style.display = "block";
    osd.innerText = "CH " + numBuffer;
    clearTimeout(numTimer);
    numTimer = setTimeout(function() {
      var targetNum = parseInt(numBuffer, 10);
      numBuffer = "";
      osd.style.display = "none";
      for (var i = 0; i < channels.length; i++) {
        if (channels[i].id === targetNum) {
          playChannel(channels[i], 0);
          break;
        }
      }
    }, 1200);
    return;
  }
  if (key === 27 || key === 8) {
    if (document.body.classList.contains("fullscreen-tv")) {
      document.body.classList.remove("fullscreen-tv");
      e.preventDefault();
      return;
    }
  }
  var focusables = Array.prototype.slice.call(document.querySelectorAll(".focusable"));
  var active = document.activeElement;
  var idx = focusables.indexOf(active);
  if (key === 40) {
    var next = idx + 1 < focusables.length ? idx + 1 : 0;
    focusables[next].focus();
    focusables[next].scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (key === 38) {
    var prev = idx - 1 >= 0 ? idx - 1 : focusables.length - 1;
    focusables[prev].focus();
    focusables[prev].scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (key === 13) {
    if (active && active.click) {
      active.click();
      e.preventDefault();
    }
  }
});

window.onload = function() {
  renderChannels();
  syncAllServers();
  playChannel(channels[18], 0); // Starts with Asianet News Live
  setTimeout(function() {
    var firstCard = document.querySelector(".ch-card");
    if (firstCard) firstCard.focus();
  }, 400);
};
</script>
