<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kerala Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.5/dist/hls.min.js"></script>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #0b0f19;
    color: #ffffff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }
  /* Main Layout */
  .app-container {
    display: flex;
    width: 100vw;
    height: 100vh;
    background-color: #0b0f19;
  }
  /* Left Side: Channel List (36% width) */
  .sidebar {
    width: 36%;
    height: 100%;
    background-color: #111827;
    border-right: 2px solid #1f2937;
    display: flex;
    flex-direction: column;
  }
  /* App Header with Built-in Logo */
  .header {
    padding: 14px 16px;
    background-color: #0f172a;
    border-bottom: 2px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
  }
  .brand-logo {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, #16a34a, #dc2626);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    color: #fff;
    margin-right: 12px;
    border: 2px solid #facc15;
  }
  .brand-title {
    font-size: 18px;
    font-weight: bold;
    color: #f8fafc;
  }
  .brand-sub {
    font-size: 11px;
    color: #38bdf8;
    margin-top: 2px;
  }
  .sync-btn {
    background-color: #0284c7;
    color: #fff;
    border: 2px solid transparent;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .sync-btn:focus, .sync-btn.focused {
    border-color: #facc15;
    background-color: #0369a1;
    outline: none;
  }
  /* Categories */
  .cat-bar {
    display: flex;
    padding: 10px 12px;
    background-color: #161f30;
    overflow-x: auto;
    border-bottom: 1px solid #1f2937;
  }
  .cat-btn {
    background-color: #1e293b;
    color: #cbd5e1;
    border: 2px solid transparent;
    padding: 6px 14px;
    margin-right: 8px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
    cursor: pointer;
  }
  .cat-btn.active {
    background-color: #16a34a;
    color: #ffffff;
  }
  .cat-btn:focus, .cat-btn.focused {
    border-color: #facc15;
    transform: scale(1.05);
    outline: none;
  }
  /* Channel List */
  .channel-list {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
  }
  .ch-card {
    display: flex;
    align-items: center;
    background-color: #1e293b;
    border: 3px solid transparent;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .ch-card.playing {
    background-color: #172554;
    border-color: #3b82f6;
  }
  .ch-card:focus, .ch-card.focused {
    border-color: #facc15 !important;
    background-color: #334155;
    outline: none;
  }
  .ch-num {
    width: 28px;
    font-size: 14px;
    font-weight: bold;
    color: #94a3b8;
  }
  .ch-logo {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 16px;
    color: #ffffff;
    margin-right: 12px;
    flex-shrink: 0;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .ch-info {
    flex: 1;
    overflow: hidden;
  }
  .ch-name {
    font-size: 16px;
    font-weight: bold;
    color: #f8fafc;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ch-cat {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 3px;
  }
  .live-dot {
    background-color: #dc2626;
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 3px 6px;
    border-radius: 4px;
  }

  /* Right Side: Video Player Area (64% width) */
  .player-area {
    width: 64%;
    height: 100%;
    background-color: #000000;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .video-wrapper {
    width: 100%;
    height: 78%;
    background-color: #000000;
    position: relative;
  }
  video {
    width: 100%;
    height: 100%;
    background-color: #000000;
    object-fit: contain;
    display: block;
  }
  .yt-frame {
    width: 100%;
    height: 100%;
    border: none;
    display: none;
    background-color: #000;
  }
  /* Status Overlay */
  .status-box {
    position: absolute;
    top: 15px;
    left: 15px;
    background-color: rgba(15, 23, 42, 0.85);
    border: 1px solid #334155;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    color: #38bdf8;
    z-index: 10;
  }
  .num-pad-osd {
    position: absolute;
    top: 15px;
    right: 20px;
    background-color: #facc15;
    color: #000;
    font-size: 26px;
    font-weight: bold;
    padding: 6px 16px;
    border-radius: 8px;
    display: none;
    z-index: 20;
  }
  /* Bottom Controls Bar */
  .player-bar {
    width: 100%;
    height: 22%;
    background-color: #0f172a;
    border-top: 2px solid #1e293b;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .now-playing-title {
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
  }
  .now-playing-sub {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 4px;
  }
  .ctrl-buttons {
    display: flex;
  }
  .ctrl-btn {
    background-color: #1e293b;
    color: #ffffff;
    border: 2px solid #334155;
    padding: 10px 16px;
    margin-left: 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .ctrl-btn:focus, .ctrl-btn.focused {
    border-color: #facc15;
    background-color: #2563eb;
    outline: none;
  }

  /* Fullscreen TV Mode */
  body.fullscreen-tv .sidebar {
    display: none;
  }
  body.fullscreen-tv .player-area {
    width: 100vw;
    height: 100vh;
  }
  body.fullscreen-tv .video-wrapper {
    width: 100vw;
    height: 100vh;
  }
  body.fullscreen-tv .player-bar {
    display: none;
  }
</style>
</head>
<body>

<div class="app-container">
  <!-- LEFT SIDEBAR -->
  <div class="sidebar">
    <div class="header">
      <div class="brand">
        <div class="brand-logo">KL</div>
        <div>
          <div class="brand-title">KERALA LIVE TV</div>
          <div class="brand-sub">Powered by Vidul Santhosh</div>
        </div>
      </div>
      <button id="syncBtn" class="sync-btn focusable" onclick="syncM3U()">Sync Live</button>
    </div>

    <div class="cat-bar" id="catBar">
      <button class="cat-btn active focusable" onclick="filterCat('All', this)">All</button>
      <button class="cat-btn focusable" onclick="filterCat('News', this)">News</button>
      <button class="cat-btn focusable" onclick="filterCat('Entertainment', this)">Entertainment</button>
      <button class="cat-btn focusable" onclick="filterCat('Music', this)">Music</button>
    </div>

    <div class="channel-list" id="channelList"></div>
  </div>

  <!-- RIGHT VIDEO AREA -->
  <div class="player-area">
    <div class="video-wrapper" onclick="toggleFullScreenMode()">
      <div class="status-box" id="statusBox">Select a channel to play</div>
      <div class="num-pad-osd" id="numOsd"></div>
      <video id="tvVideo" autoplay playsinline webkit-playsinline controls></video>
      <iframe id="ytFrame" class="yt-frame" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="player-bar">
      <div>
        <div class="now-playing-title" id="npTitle">Kerala Live TV</div>
        <div class="now-playing-sub" id="npSub">Remote: Use Up/Down Arrows & OK Button</div>
      </div>
      <div class="ctrl-buttons">
        <button class="ctrl-btn focusable" onclick="tryBackupStream()">Switch Server</button>
        <button class="ctrl-btn focusable" onclick="openYouTubeBackup()">YouTube Live</button>
        <button class="ctrl-btn focusable" onclick="toggleFullScreenMode()">Full Screen</button>
      </div>
    </div>
  </div>
</div>

<script>
var channels = [

      "https://vidcdn.vidgyor.com/asianet-origin/liveabr/playlist.m3u8"

    ytId: "live_stream?channel=UCFx1nseXKTc1Culiu3neeSQ"
  },
  {

  {

    badge: "M1",
    color: "#0d9488",

      "https://cdn-3.pishow.tv/live/1481/master.m3u8"
    ],
    ytId: "live_stream?channel=UC-f7r46JhLbdHvLP_97593w"
  },
  {
    id: 8,
    name: "News Malayalam 24x7",
    cat: "News",
    badge: "NM",
    color: "#7c3aed",
    urls: [],
    ytId: "live_stream?channel=UC31e3H2K_e24tH4B89B-9cQ"

    name: "Janam TV",

    ],

  },
  {

    name: "DD Malayalam",
    cat: "Entertainment",
    badge: "DD",
    color: "#9333ea",
    urls: [],
    ytId: "live_stream?channel=UC-f7r46JhLbdHvLP_97593w"
  },
  {
    id: 11,
    name: "Kairali TV",
    cat: "Entertainment",
    badge: "KT",
    color: "#db2777",
    urls: [],
    ytId: "live_stream?channel=UCkCwPrfeNiX56hH3G56RphA"
  },
  {
    id: 12,
    name: "Safari TV",
    cat: "Entertainment",
    badge: "SF",
    color: "#ca8a04",
    urls: [],
    ytId: "live_stream?channel=UC5_K3_E7F8kH4B89B-9cQ"
  },
  {
    id: 13,
    name: "Kappa TV",
    cat: "Music",
    badge: "KP",
    color: "#e11d48",
    urls: [],
    ytId: "live_stream?channel=UC2X5_K3_E7F8kH4B89B"
  }
];

var currentCat = "All";
var currentChannel = null;
var currentUrlIndex = 0;
var hlsInstance = null;
var numBuffer = "";
var numTimer = null;

function renderChannels() {
  var listEl = document.getElementById("channelList");
  listEl.innerHTML = "";
  for (var i = 0; i < channels.length; i++) {
    var ch = channels[i];
    if (currentCat !== "All" && ch.cat !== currentCat) continue;

    var card = document.createElement("div");
    card.className = "ch-card focusable" + (currentChannel && currentChannel.id === ch.id ? " playing" : "");
    card.tabIndex = 0;
    card.setAttribute("data-id", ch.id);
    card.onclick = (function(channelObj) {
      return function() {
        if (currentChannel && currentChannel.id === channelObj.id) {
          toggleFullScreenMode();
        } else {
          playChannel(channelObj, 0);
        }
      };
    })(ch);

    card.innerHTML =
      '<div class="ch-num">' + ch.id + '</div>' +
      '<div class="ch-logo" style="background-color:' + (ch.color || '#2563eb') + ';">' + ch.badge + '</div>' +
      '<div class="ch-info">' +
        '<div class="ch-name">' + ch.name + '</div>' +
        '<div class="ch-cat">' + ch.cat + '</div>' +
      '</div>' +
      '<div class="live-dot">LIVE</div>';

    listEl.appendChild(card);
  }
}

function filterCat(cat, btnEl) {
  currentCat = cat;
  var btns = document.querySelectorAll(".cat-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.remove("active");
  }
  if (btnEl) btnEl.classList.add("active");
  renderChannels();
}

function setStatus(msg) {
  var sb = document.getElementById("statusBox");
  sb.style.display = "block";
  sb.innerText = msg;
}

function playChannel(ch, urlIdx) {
  currentChannel = ch;
  currentUrlIndex = urlIdx || 0;
  document.getElementById("npTitle").innerText = ch.id + ". " + ch.name;
  document.getElementById("npSub").innerText = "Category: " + ch.cat + " | Press OK again for Full Screen";
  renderChannels();

  var video = document.getElementById("tvVideo");
  var ytFrame = document.getElementById("ytFrame");

  ytFrame.style.display = "none";
  ytFrame.src = "";
  video.style.display = "block";

  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }

  if (!ch.urls || ch.urls.length === 0 || currentUrlIndex >= ch.urls.length) {
    setStatus("Loading Live Stream (Server 2)...");
    syncM3U(ch.name);
    return;
  }

  var streamUrl = ch.urls[currentUrlIndex];
  setStatus("Playing: " + ch.name + "...");

  if (window.Hls && Hls.isSupported()) {
    hlsInstance = new Hls({
      enableWorker: true,
      lowLatencyMode: true
    });
    hlsInstance.loadSource(streamUrl);
    hlsInstance.attachMedia(video);
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
      setStatus("LIVE: " + ch.name);
      video.play().catch(function(){});
    });
    hlsInstance.on(Hls.Events.ERROR, function(event, data) {
      if (data.fatal) {
        tryBackupStream();
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = streamUrl;
    video.addEventListener("loadedmetadata", function() {
      setStatus("LIVE: " + ch.name);
      video.play().catch(function(){});
    });
  } else {
    video.src = streamUrl;
    video.play().catch(function(){});
  }
}

function tryBackupStream() {
  if (!currentChannel) return;
  if (currentChannel.urls && currentUrlIndex + 1 < currentChannel.urls.length) {
    playChannel(currentChannel, currentUrlIndex + 1);
  } else {
    openYouTubeBackup();
  }
}

function openYouTubeBackup() {
  if (!currentChannel) return;
  var video = document.getElementById("tvVideo");
  var ytFrame = document.getElementById("ytFrame");
  if (hlsInstance) {
    hlsInstance.destroy();
    hlsInstance = null;
  }
  video.pause();
  video.style.display = "none";
  ytFrame.style.display = "block";
  setStatus("YouTube Live Mode: " + currentChannel.name);

  if (currentChannel.ytId) {
    ytFrame.src = "https://www.youtube.com/embed/" + currentChannel.ytId + "&autoplay=1";
  } else {
    var q = encodeURIComponent(currentChannel.name + " malayalam live tv");
    window.location.href = "https://www.youtube.com/results?search_query=" + q;
  }
}

function toggleFullScreenMode() {
  if (document.body.classList.contains("fullscreen-tv")) {
    document.body.classList.remove("fullscreen-tv");
  } else {
    document.body.classList.add("fullscreen-tv");
  }
}

function syncM3U(autoPlayName) {
  setStatus("Syncing Malayalam Live M3U...");
  var xhr = new XMLHttpRequest();
  xhr.open("GET", "https://iptv-org.github.io/iptv/languages/mal.m3u", true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        parseM3U(xhr.responseText, autoPlayName);
      } else {
        setStatus("Sync finished. Using default streams.");
        if (autoPlayName && currentChannel) openYouTubeBackup();
      }
    }
  };
  xhr.send();
}

function parseM3U(data, autoPlayName) {
  var lines = data.split("\n");
  var currentName = "";
  var added = 0;

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line.indexOf("#EXTINF:") === 0) {
      var parts = line.split(",");
      currentName = parts[parts.length - 1].trim();
    } else if (line.indexOf("http") === 0 && currentName !== "") {
      var matched = false;
      for (var j = 0; j < channels.length; j++) {
        var cName = channels[j].name.toLowerCase();
        var mName = currentName.toLowerCase();
        if (mName.indexOf(cName.split(" ")[0]) !== -1) {
          if (channels[j].urls.indexOf(line) === -1) {
            channels[j].urls.unshift(line);
          }
          matched = true;
          break;
        }
      }
      if (!matched) {
        var badgeTxt = currentName.substring(0, 2).toUpperCase();
        channels.push({
          id: channels.length + 1,
          name: currentName,
          cat: "Entertainment",
          badge: badgeTxt,
          color: "#0284c7",
          urls: [line],
          ytId: ""
        });
        added++;
      }
      currentName = "";
    }
  }
  renderChannels();
  setStatus("Synced! " + channels.length + " Malayalam Channels Ready.");

  if (autoPlayName && currentChannel && currentChannel.urls.length > 0) {
    playChannel(currentChannel, 0);
  }
}

/* TV Remote Control (D-Pad & Number Keys) */
document.addEventListener("keydown", function(e) {
  var key = e.keyCode || e.which;

  // Number keys 0-9
  if (key >= 48 && key <= 57) {
    var digit = String(key - 48);
    numBuffer += digit;
    var osd = document.getElementById("numOsd");
    osd.style.display = "block";
    osd.innerText = "CH " + numBuffer;
    clearTimeout(numTimer);
    numTimer = setTimeout(function() {
      var targetNum = parseInt(numBuffer, 10);
      numBuffer = "";
      osd.style.display = "none";
      for (var i = 0; i < channels.length; i++) {
        if (channels[i].id === targetNum) {
          playChannel(channels[i], 0);
          break;
        }
      }
    }, 1200);
    return;
  }

  // Back / Escape exits fullscreen
  if (key === 27 || key === 8) {
    if (document.body.classList.contains("fullscreen-tv")) {
      document.body.classList.remove("fullscreen-tv");
      e.preventDefault();
      return;
    }
  }

  // In Fullscreen, Up/Down changes channel directly
  if (document.body.classList.contains("fullscreen-tv")) {
    if (key === 38 && currentChannel) { // Up
      var prevIdx = (currentChannel.id - 2 + channels.length) % channels.length;
      playChannel(channels[prevIdx], 0);
      e.preventDefault();
      return;
    }
    if (key === 40 && currentChannel) { // Down
      var nextIdx = currentChannel.id % channels.length;
      playChannel(channels[nextIdx], 0);
      e.preventDefault();
      return;
    }
  }

  // D-Pad Focus Navigation
  var focusables = Array.prototype.slice.call(document.querySelectorAll(".focusable"));
  var active = document.activeElement;
  var idx = focusables.indexOf(active);

  if (key === 40) { // Down Arrow
    var next = idx + 1 < focusables.length ? idx + 1 : 0;
    focusables[next].focus();
    focusables[next].scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (key === 38) { // Up Arrow
    var prev = idx - 1 >= 0 ? idx - 1 : focusables.length - 1;
    focusables[prev].focus();
    focusables[prev].scrollIntoView({ block: "nearest" });
    e.preventDefault();
  } else if (key === 13) { // OK / Enter
    if (active && active.click) {
      active.click();
      e.preventDefault();
    }
  }
});

window.onload = function() {
  renderChannels();
  playChannel(channels[0], 0);
  syncM3U();
  setTimeout(function() {
    var firstCard = document.querySelector(".ch-card");
    if (firstCard) firstCard.focus();
  }, 400);
};
</script>
